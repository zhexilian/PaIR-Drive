[build-system]
requires = ["setuptools>=65.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-drive"
version = "0.1.0"
description = "Pair-Drive DiffusionDrive, Parallel-IR, RWM inference and NAVSIM PDM evaluation"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = {file = "LICENSE"}
dependencies = [
  "aioboto3==15.2.0",
  "boto3==1.40.18",
  "diffusers==0.35.2",
  "geopandas==1.0.1",
  "hydra-core==1.2.0",
  "matplotlib==3.9.4",
  "numpy==1.26.4",
  "nuplan-devkit @ git+https://gitee.com/lianzhexi/nuplan-devkit/@ce3c323af01c0d7ec5672f7832ef53f9c679aab0",
  "omegaconf==2.3.0",
  "opencv-python==4.9.0.80",
  "pandas==2.3.3",
  "pillow==11.3.0",
  "psutil==7.1.0",
  "pyogrio==0.11.1",
  "pyquaternion==0.9.9",
  "pytest==8.4.2",
  "rasterio==1.3.11",
  "requests==2.32.5",
  "retry==0.9.2",
  "rtree==1.4.1",
  "scipy==1.13.1",
  "shapely==2.0.7",
  "timm==1.0.20",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
distributed = ["ray==2.49.2"]

[tool.setuptools.packages.find]
include = ["pairdrive*", "navsim*"]

[tool.setuptools.package-data]
pairdrive = ["assets/*.npy"]
"navsim.planning.script.config" = ["**/*.yaml"]
